<link rel="stylesheet" href="css/ora.css?v=38">
<style>
.pdp{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(14px,1.8vw,30px);padding:calc(var(--hdr) + 18px) var(--gut) clamp(90px,10vw,150px);align-items:start}
.gw{grid-column:1/8;min-width:0}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gal .media{aspect-ratio:4/5}
.gal .media.w{grid-column:1/-1;aspect-ratio:1/1}
.gal .media.w.wide{aspect-ratio:3/2}
.gal .pack img{width:50%;max-width:400px}
.gal .media.lblc{background:var(--cream);display:grid;place-items:center}
.gal .media.lblc img{width:58%;height:auto;object-fit:contain;box-shadow:0 30px 50px -30px rgba(33,29,26,.45);border-radius:4%}
.gal .media.lblc .cap{color:var(--roast)}
.gal .cap{position:absolute;left:18px;bottom:16px;z-index:2;color:var(--butter);font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;opacity:.85}
.gal-n{display:none}
.info{grid-column:9/13;position:sticky;top:calc(var(--hdr) + 18px);padding-top:clamp(10px,2vw,30px)}
.crumbs{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;opacity:.5;display:flex;gap:10px}
.info h1{margin:28px 0 10px}
.info .sub{font-family:var(--serif);font-style:italic;font-size:22px;opacity:.72}
.meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:24px 0 0;font-size:13px}
.meta .lot{opacity:.55;letter-spacing:.06em}
.pr{display:flex;align-items:baseline;gap:14px;margin:30px 0 0;padding-top:24px;border-top:1px solid var(--line)}
.pr b{font-family:var(--serif);font-weight:400;font-size:clamp(34px,2.8vw,44px);letter-spacing:-.01em}
.pr span{font-size:13px;opacity:.55}
.info .lede{margin:22px 0 18px;font-size:clamp(21px,1.6vw,25px)}
.opt{margin-top:30px}
.opt .lb{display:flex;justify-content:space-between;gap:12px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;margin-bottom:12px}
.opt .lb span:last-child{opacity:.55;letter-spacing:.04em;text-transform:none;font-weight:400;font-size:13px}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw button,.sw .fix{border:1px solid var(--line);padding:14px 16px;text-align:left;display:flex;align-items:center;gap:12px;transition:border-color .4s,background .4s,color .4s;border-radius:2px}
.sw button:hover{border-color:var(--roast)}
.sw button[aria-pressed="true"],.sw .fix{border-color:var(--roast);box-shadow:inset 0 0 0 1px var(--roast)}
.sw i{width:26px;height:34px;flex:none;border-radius:3px;background:var(--espresso);display:grid;place-items:center}
.sw i.mocha{background:var(--mocha)}
.sw i img{width:70%}
.sw b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.15}
.sw small{display:block;font-size:12px;opacity:.6;margin-top:2px}
.sw .fix{grid-column:1/-1;cursor:default}
.plans{display:grid;gap:10px}
.plans label{border:1px solid var(--line);padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;cursor:pointer;transition:border-color .4s,box-shadow .4s;border-radius:2px}
.plans label:has(input:checked){border-color:var(--roast);box-shadow:inset 0 0 0 1px var(--roast)}
.plans input{appearance:none;width:16px;height:16px;border:1px solid var(--roast);border-radius:50%;margin:4px 0 0;display:grid;place-items:center}
.plans input:checked::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--roast)}
.plans b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.2}
.plans small{display:block;font-size:13px;opacity:.62;margin-top:3px;line-height:1.45}
.plans .p{font-family:var(--serif);font-size:18px;white-space:nowrap}
.buy{display:flex;gap:10px;margin-top:28px}
.buy .qty{margin:0;height:58px;border-radius:58px}
.buy .qty button{width:44px;height:56px}
.buy .btn{flex:1;justify-content:space-between;height:58px}
.ship{display:flex;gap:10px;align-items:center;font-size:13px;opacity:.62;margin:16px 0 0}
.ship svg{width:16px}
.trust{list-style:none;margin:26px 0 0;padding:20px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.trust li{font-size:12.5px;line-height:1.45;opacity:.7}
.trust b{display:block;font-family:var(--serif);font-weight:400;font-size:18px;opacity:1;margin-bottom:2px}
.cup{padding:clamp(60px,7vw,110px) var(--gut);text-align:center;overflow:hidden}
.cup .eyebrow{justify-content:center}
.cup .w{font-family:var(--serif);font-style:italic;font-size:clamp(48px,6.6vw,116px);line-height:.98;letter-spacing:-.03em;margin:30px 0 0}
.cup .w span{display:block}
.cup .w span:nth-child(2){opacity:.75}
.cup .w span:nth-child(3){opacity:.62}
.cup .row{display:flex;justify-content:center;gap:clamp(24px,5vw,90px);flex-wrap:wrap;margin-top:clamp(36px,4vw,60px);padding-top:26px;border-top:1px solid var(--line)}
.cup .row div{text-align:left}
.cup .row small{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;opacity:.6;margin-bottom:6px}
.cup .row b{font-family:var(--serif);font-weight:400;font-size:24px}
.gmsg{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.gmsg summary,.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
.gmsg summary::-webkit-details-marker,.acc summary::-webkit-details-marker{display:none}
.gmsg summary::after,.acc summary::after{content:"+";font-size:18px;font-weight:400;letter-spacing:0}
.gmsg[open] summary::after,.acc details[open] summary::after{content:"−"}
.gmsg textarea{width:100%;margin-top:14px;background:none;border:1px solid var(--line);padding:14px;font-family:var(--serif);font-size:19px;color:inherit;resize:vertical;outline:none}
.acc{margin-top:34px}
.acc details{border-top:1px solid var(--line)}
.acc details:last-child{border-bottom:1px solid var(--line)}
.acc summary{padding:19px 0}
.acc .a{padding:0 0 20px;font-size:15px;line-height:1.65;opacity:.8}
.acc ul{margin:0;padding-left:18px;display:grid;gap:4px}

/* ficha técnica */
.spec{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(14px,1.8vw,30px)}
.spec .l{grid-column:1/5}
.spec .l p{margin:22px 0 0;opacity:.72;max-width:22em}
.spec dl{grid-column:6/13;display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(20px,3vw,50px);margin:0}
.spec dl div{display:grid;grid-template-columns:9.5em 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.spec dt{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;opacity:.55;padding-top:4px}
.spec dd{margin:0;font-family:var(--serif);font-size:19px;line-height:1.3}

/* processo */
.proc{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(14px,1.8vw,30px);align-items:center}
.proc .ph{grid-column:1/7;aspect-ratio:5/4}
.proc .tx{grid-column:8/12}
.proc .tx h2{margin:22px 0 26px}
.proc .tx .lede{margin-bottom:34px}

/* o que vem no kit */
.inbox{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(14px,1.8vw,30px)}
.inbox .ibx2{grid-column:1/6;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(10px,1vw,16px);min-height:100%}
.inbox .r{grid-column:1/-1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(14px,1.8vw,30px)}.inbox .r > .eyebrow,.inbox .r > h2{grid-column:1/6}.inbox .r > h2{grid-row:2}.inbox .r ol{grid-column:7/13;grid-row:1/4;margin-top:0!important}.inbox .r ol{margin-top:clamp(24px,2.4vw,36px)}
.inbox .ibx{border-radius:3px;position:relative;min-height:220px;overflow:hidden}.inbox .ibx img{position:absolute;inset:0}.inbox .ibx img{width:100%;height:100%;object-fit:cover}.inbox .ibx .cap{position:absolute;left:14px;bottom:12px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;background:rgba(28,20,14,.6);color:var(--butter);padding:5px 10px 4px;border-radius:30px}
.inbox ol{list-style:none;margin:0;padding:0;counter-reset:i}
.inbox li{counter-increment:i;display:grid;grid-template-columns:3em 1fr;padding:20px 0;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:clamp(22px,1.8vw,28px);line-height:1.2}
.inbox li::before{content:counter(i,decimal-leading-zero);font-family:var(--sans);font-size:11px;letter-spacing:.2em;font-weight:700;opacity:.5;padding-top:8px}

/* também */
.more .hd{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(36px,4vw,60px)}
.other{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(14px,1.8vw,30px);margin-bottom:0;align-items:center}
.other .pk{grid-column:1/7;aspect-ratio:5/4}
.other .pk.pack img{width:34%}
.other .tx{grid-column:7/12}
.other h3{margin:16px 0 8px}
.other .tx .lede{margin:18px 0 28px}

/* barra fixa */
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:58;background:var(--butter);border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:12px var(--gut);transform:translateY(105%);transition:transform .7s var(--ease)}
.sbar.on{transform:none}
.sbar .th{width:40px;height:50px;flex:none;display:grid;place-items:center;background:var(--espresso);overflow:hidden}
.sbar .th.mocha{background:var(--mocha)}
.sbar .th img{width:70%}
.sbar .th.ph img{width:100%;height:100%;object-fit:cover}
.sbar .n{flex:1;min-width:0}
.sbar .n b{display:block;font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .n span{font-size:12px;opacity:.6}
.sbar .num{font-size:22px}
.sbar .btn{height:46px}

@media (max-width:1100px){.gw{grid-column:1/8}.info{grid-column:8/13}}
@media (max-width:960px){
  .pdp{grid-template-columns:1fr;padding-top:var(--hdr)}
  .gw,.info{grid-column:1/-1}
  .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut);scrollbar-width:none}
  .gal::-webkit-scrollbar{display:none}
  .gal .media,.gal .media.w,.gal .media.w.wide{flex:0 0 88%;aspect-ratio:4/5;scroll-snap-align:center}
  .gal-n{display:block;margin-top:12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;opacity:.55}
  .info{position:static;padding-top:24px}
  .spec .l,.spec dl,.proc .ph,.proc .tx,.inbox .ibx2,.inbox .r,.other .pk,.other .tx{grid-column:1/-1}
  .spec dl{margin-top:34px}
  .proc .tx,.other .tx{margin-top:34px}
  .inbox .r{order:-1;margin-bottom:30px}.inbox .ibx2{grid-auto-flow:row;grid-template-columns:1fr 1fr;grid-auto-rows:auto}.inbox .ibx{aspect-ratio:4/5;min-height:0}.inbox .ibx:only-child{grid-column:1/-1;aspect-ratio:4/3}
}
@media (max-width:640px){
  .spec dl{grid-template-columns:1fr}
  .spec dl div{grid-template-columns:8.5em 1fr}
  .sbar .n span{display:none}.sbar .num{font-size:17px}
}
.gal .media.kraft{background:radial-gradient(120% 90% at 50% 30%,#cbb9a3 0%,var(--mocha) 55%,#a69079 100%);display:grid;place-items:center}
.gal .media.kraft img{width:auto;height:84%;object-fit:contain;filter:drop-shadow(0 30px 30px rgba(40,25,15,.3))}
.gal .media.kraft .cap,.gal .media.w.wide .cap{color:var(--roast);opacity:.75}
.sw .fix{border:0;box-shadow:none;padding:4px 0}
.cup .row b:last-child{opacity:1}
@media (max-width:700px){.cup .row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:left}.cup .row b{font-size:19px}}
.kgrid.k2{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.gband{display:flex;justify-content:space-between;align-items:end;gap:30px;flex-wrap:wrap}.gband h2{margin:0 0 14px}.gband p{margin:0;max-width:34em;opacity:.78}
</style>
<style>

/* Editorial rebuild: photographic chapters, tighter catalog, varied section rhythm. */

.hero::after{background:linear-gradient(180deg,rgba(20,26,18,.28),rgba(20,26,18,.04) 35%,rgba(20,26,18,.68) 100%)}
.hero video{filter:brightness(1.04) saturate(.92)}
.hero .bg{inset:0}
.chd{padding-block:76px 46px;align-items:end}
.chd .r>p{margin:0;max-width:28em}
.coffee-pair{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding-bottom:90px;background:var(--butter)}
.coffee-pair .cafe,.coffee-pair .cafe.rev{display:flex;flex-direction:column;min-height:0;background:none}
.coffee-pair .cafe .pk,.coffee-pair .cafe.rev .pk{width:100%;aspect-ratio:1.18;order:0;flex:none}
.coffee-pair .cafe .pk .pack img{width:35%;max-height:80%;object-fit:contain}
.coffee-pair .cafe .pk .ix{font-size:72px;opacity:.23}
.coffee-pair .cafe .tx,.coffee-pair .cafe.rev .tx{order:1;padding:28px 0 0;display:block}
.coffee-pair .cafe .tx h2{font-size:clamp(40px,4.2vw,72px);margin:12px 0}
.coffee-pair .cafe .tx h2 .ln{display:inline}
.coffee-pair .cafe .tx h2 .ln>span{display:inline}
.coffee-pair .cafe .tx .lede{font-size:23px;margin:20px 0;max-width:25em;min-height:2.75em}
.coffee-pair .cafe .sub{font-size:18px}
.coffee-pair .cafe dl{display:none}
.coffee-pair .cafe .buy{margin-top:25px;gap:18px}
.coffee-pair .cafe .buy .num{font-size:29px;margin-right:auto}
.coffee-pair .cafe .eyebrow{font-size:10px}
.hist.story-banner{height:70svh;min-height:540px}
.founder-section{display:grid;grid-template-columns:43% 57%;align-items:stretch}
.founder-photo{margin:0;position:relative;min-height:760px}
.founder-photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.founder-photo figcaption{position:absolute;bottom:28px;left:32px;color:var(--cream);font-family:var(--serif);font-style:italic;font-size:24px;text-shadow:0 2px 15px #211d1a}
.founder.founder-letter{max-width:none;padding:80px clamp(34px,5vw,82px);margin:0}
.founder-letter h2{font-size:clamp(48px,5vw,80px);margin:14px 0 36px}
.founder-letter .ftxt .lede{font-size:31px;line-height:1.25;max-width:15em}
.founder-letter .ftxt p{font-size:16px;line-height:1.65}
.founder-letter .ftxt p:last-child{font-size:26px;margin-top:30px;padding-top:25px;border-top:1px solid var(--line)}
.origin-section{position:relative;display:grid;grid-template-columns:54% 46%;overflow:hidden}
.origin-visual{min-height:760px;grid-column:1;grid-row:1}
.origin-visual video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.farm.origin-copy{display:block;padding:85px clamp(32px,4vw,64px);grid-column:2;grid-row:1;align-self:center}
.origin-copy .l,.origin-copy .r{display:block;grid-column:auto}
.origin-copy .r .lede{font-size:32px;margin:32px 0 22px}
.origin-copy .r .body{font-size:16px;line-height:1.7}
.origin-copy .facts{grid-template-columns:1fr 1fr;gap:24px;margin-top:36px}
.origin-copy .facts b{font-size:30px}
.origin-copy .facts div{padding-top:0}
.origin-copy .facts div:last-child{grid-column:1/-1}
.origin-copy .facts{padding-top:24px}
.steps{display:block}
.steps>.l{position:static;display:grid;grid-template-columns:1fr 1fr;align-items:end;gap:0 50px;margin-bottom:56px}
.steps>.l>.chap{grid-column:1/-1}
.steps>.l>p{margin:0;max-width:30em}
.steps ol{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:44px 28px;margin:0}
.steps li{display:grid;grid-template-columns:34px 1fr;grid-column:span 2;gap:22px 10px;padding:0;border:0!important;align-content:start}
.steps li:nth-child(4),.steps li:nth-child(5){grid-column:span 3}
.steps .step-photo{grid-column:1/-1;aspect-ratio:1.3}
.steps .step-photo img{width:100%;height:100%;object-fit:cover}
.steps li:nth-child(4) .step-photo,.steps li:nth-child(5) .step-photo{aspect-ratio:1.8}
.steps li h3{font-size:32px;line-height:1.08}
.steps li p{font-size:15px;line-height:1.65}
.steps li i{font-size:24px;padding-top:4px}
.lhead.shop-hero{position:relative;min-height:620px;padding-top:240px;padding-bottom:64px;color:var(--cream);overflow:hidden;isolation:isolate;grid-template-columns:1fr 1fr;align-items:end;margin-bottom:65px;background:var(--espresso)}
.shop-hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 46%;z-index:-2}
.shop-hero::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(33,29,26,.65),rgba(33,29,26,.1) 55%,rgba(33,29,26,.62))}
.lhead.shop-hero h1{grid-column:1;font-size:clamp(90px,12vw,185px)}
.lhead.shop-hero .r{grid-column:2;max-width:26em;justify-self:end;margin:0}
.lhead.shop-hero .r p{opacity:1}
body[data-page=loja] .ct .pk{aspect-ratio:1.15}
body[data-page=loja] .ct .pk .pack img{width:34%}
.cmp td{padding-block:23px;font-size:22px}
.kgrid{width:100%;min-width:0;grid-template-columns:repeat(3,minmax(0,1fr))!important}
.kgrid>*{min-width:0}
.kc-img{aspect-ratio:1.05}
.box4{grid-template-columns:1fr 1fr;gap:38px}
.box4 .media{aspect-ratio:1.35}
.box4 figcaption{display:flex;justify-content:space-between;gap:20px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:18px}
.box4 b{font-size:28px}
@media(max-width:960px){
.founder-section,.origin-section{grid-template-columns:1fr 1fr}
.founder.founder-letter{padding:55px 30px}
.founder-photo{min-height:650px}
.origin-visual{min-height:650px}
.farm.origin-copy{padding:55px 30px}
.origin-copy .r .lede{font-size:27px}
.coffee-pair .cafe .buy .num{width:100%;margin:0}
.coffee-pair .cafe .tx h2{font-size:43px}
.steps li{grid-column:span 3}
.steps li:nth-child(4){grid-column:span 3}
.steps li:nth-child(5){grid-column:span 6}
.steps li:nth-child(5) .step-photo{aspect-ratio:2.2}
}
@media(max-width:700px){

.chd{padding-block:54px 30px}
.chd>.r{margin-top:20px}
.coffee-pair{grid-template-columns:1fr;gap:50px;padding-bottom:60px}
.coffee-pair .cafe .pk,.coffee-pair .cafe.rev .pk{aspect-ratio:1.1}
.coffee-pair .cafe .tx h2{font-size:46px}
.coffee-pair .cafe .tx .lede{min-height:0;font-size:23px}
.coffee-pair .cafe .buy .num{width:auto;margin-right:auto}
.coffee-pair .cafe .buy{gap:13px}
.coffee-pair .cafe .buy .btn{padding-inline:19px}
.coffee-pair .cafe .buy .link{font-size:12px}
.hist.story-banner{height:78svh;min-height:570px}
.founder-section,.origin-section{display:flex;flex-direction:column}
.founder-photo{min-height:0;height:420px}
.founder-photo img{object-position:50% 45%}
.founder.founder-letter{padding:48px var(--gut) 58px}
.founder-letter .ftxt .lede{font-size:29px}
.origin-visual{min-height:0;height:360px}
.farm.origin-copy{padding:48px var(--gut) 58px}
.origin-copy .r{margin:0}
.origin-copy .r .lede{font-size:29px}
.steps>.l{display:block;margin-bottom:35px}
.steps>.l>p{margin-top:24px}
.steps ol{display:block}
.steps li{margin-top:35px}
.steps li .step-photo,.steps li:nth-child(4) .step-photo,.steps li:nth-child(5) .step-photo{aspect-ratio:1.5}
.lhead.shop-hero{min-height:590px;display:flex;flex-direction:column;justify-content:end;align-items:start;padding-top:200px;padding-bottom:44px;margin-bottom:40px;gap:28px}
.lhead.shop-hero h1{font-size:100px}
.lhead.shop-hero .r{max-width:26em}
.shop-hero::after{background:linear-gradient(180deg,rgba(33,29,26,.25),rgba(33,29,26,.76))}
body[data-page=loja] .ct .pk{aspect-ratio:1.1}
.cmp table{table-layout:fixed}
.cmp td{font-size:17px;padding-block:18px;overflow-wrap:anywhere}
.cmp td:first-child{width:26%;font-size:9px;letter-spacing:.1em}
.cmp th{font-size:9px;letter-spacing:.08em}
.kgrid,.kgrid.k2{grid-template-columns:1fr!important;gap:44px}
.kc-img{aspect-ratio:1.12}
.kc-b{display:flex;gap:15px}
.kc-b .num{font-size:23px;margin:0;flex-shrink:0}
.box4{grid-template-columns:1fr;gap:30px}
.box4 .media{aspect-ratio:1.22}
.box4 figcaption{display:block}
.box4 b{font-size:26px}
}


.info,.pdp > *{min-width:0}
@media (max-width:420px){[data-buyrow]{flex-wrap:wrap}[data-buyrow] .btn{flex:1 1 auto;min-width:0;padding-inline:18px;gap:10px}}
.crumbs a,.crumbs span{opacity:.75}
.opt .lb span,.meta .lot,.pr span,.gal-n,.spec dt,.sw small,.plans small,.ship,.cup .row small{opacity:.78!important}
.sbar .n b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px;line-height:1.15}
@media (max-width:380px){.sbar .th{display:none}}
.opt .lb span:only-child{opacity:1!important;letter-spacing:.22em;text-transform:uppercase;font-weight:700;font-size:11px}
@media (max-width:420px){.trust{grid-template-columns:1fr;gap:14px}.trust b{font-size:17px;margin:0 0 2px}}
.gband{display:flex;justify-content:space-between;align-items:end;gap:30px;flex-wrap:wrap}.gband h2{margin:0 0 14px}.gband p{margin:0;max-width:34em;opacity:.78}
</style>
</head>
<body data-page="produto" data-hdr="light">

<main class="pdp">
  <div class="gw">
    <div class="gal" data-gal></div>
    <p class="gal-n" data-galn></p>
  </div>
  <div class="info" data-info></div>
</main>

<div data-below></div>

<div class="sbar" data-sbar aria-hidden="true"></div>

<script src="js/vendor/lenis.min.js"></script>
<script src="js/logo.js?v=38"></script>
<script src="js/catalogo.js?v=38"></script>
<script>
window.ORA_PAGE = () => {
  const $ = s => document.querySelector(s);
  const C = ORA_CATALOGO, q = new URLSearchParams(location.search);
  const ARR = ORA_ARR;
  const TRUCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 6h12v10H2zM14 10h4l3 3v3h-7"/><circle cx="6" cy="17.5" r="1.6"/><circle cx="17" cy="17.5" r="1.6"/></svg>';
  if (q.get('p') && !oraProd(q.get('p'))) { location.replace('loja.html'); return; }
  let p = oraProd(q.get('p')) || oraProd('cafe-natural');
  if (p.tipoLoja === 'drip') { location.replace('loja.html#drip'); return; }
  let st = { qty: 1, sub: false, t: '500', v: oraCafe(q.get('c')) ? q.get('c') : 'natural' };

  const media = (src, cls = '', cap = '') => {
    const isV = src.endsWith('.mp4');
    const el = isV ? `<video src="${src}" poster="${src.replace('.mp4', '.jpg')}" autoplay muted loop playsinline></video>` : `<img src="${src}" alt="${cap || p.nome}">`;
    return `<div class="media ${cls}">${el}${cap ? `<span class="cap">${cap}</span>` : ''}</div>`;
  };
  const sw = (c, on) => `<button type="button" data-sw="${c.id}" aria-pressed="${on}"><i class="${c.cor === 'mocha' ? 'mocha' : ''}"><img src="${c.img}" alt=""></i><span><b>${c.nome}</b><small>${c.id === 'natural' ? 'Mais doce e encorpado' : 'Mais limpo e cítrico'}</small></span></button>`;

  function render() {
    const isCafe = p.tipoLoja === 'cafe';
    const c = oraCafe(isCafe ? p.cafe : st.v);
    document.title = (isCafe ? 'Café ' + p.nome : p.nome) + ' · ORA';

    /* galeria */
    const g = isCafe
      ? [media(c.img, 'w pack' + (c.cor === 'mocha' ? ' mocha' : '')), media('assets/video/po.mp4', '', 'Moagem para coado'), ...(c.img250 && st.t !== '250' ? [media(c.img250, 'kraft', 'Kraft · 250 g')] : [media('assets/img/px-coado.jpg', '', 'Pronto em minutos')]), media('assets/img/px-colheita-cesto.jpg', 'w wide', 'A colheita')]
      : [media(p.img, 'w wide'), `<div class="media" style="background:${c.id === 'cereja' ? 'radial-gradient(120% 90% at 50% 30%,#d6c5ae 0%,#bfa98f 55%,#a48e75 100%)' : 'radial-gradient(120% 90% at 50% 30%,#8a6150 0%,#6a4636 55%,#4e3227 100%)'}"><img src="${c.img}" alt="Pacote do ${c.nomeCompleto}, 500 g" style="object-fit:contain;padding:10% 0 8%"><span class="cap" style="color:var(--butter)">Café ORA 500 g</span></div>`, media('assets/img/cartao-frente.jpg', '', 'Cartão ORA')];
    $('[data-gal]').innerHTML = g.join('');
    if (isCafe) $('[data-gal] .pack').innerHTML = `<img src="${st.t === '250' && c.img250 ? c.img250 : c.img}" alt="Pacote do ${c.nomeCompleto}, ${st.t} g">`;
    $('[data-galn]').textContent = `${g.length} imagens · deslize`;

    /* informações e compra */
    const precoBase = () => (st.t === '250' && p.p250) ? p.p250 : p.preco;
    const precoCompra = () => st.sub ? Math.round(precoBase() * .85) : precoBase();
    const total = () => brl(precoCompra() * st.qty);
    $('[data-info]').innerHTML = `
      <div class="crumbs"><a href="${isCafe ? 'loja.html' : 'presentes.html'}">${isCafe ? 'Nossos cafés' : 'Presentes'}</a><span>/</span><span>${p.nome}</span></div>
      <h1 class="display lg">${isCafe ? p.nome.replace(' Descascado', ' <em class="it">Descascado</em>') : p.nome}</h1>
      <span class="sub">${isCafe ? c.sub : p.tipo}</span>
      <div class="pr"><b class="num">${isCafe && st.sub ? brl(Math.round(precoBase() * .85)) + '<small style="font-size:.5em;opacity:.7">/mês</small>' : brl(precoBase())}</b><span>${isCafe ? st.t + ' g' + (st.sub ? ' · assinatura; avulso ' + brl(precoBase()) : '') : ''}</span></div>
      <p class="lede">${isCafe ? c.lede : p.resumo}</p>
      <div class="opt"><div class="lb"><span>${isCafe ? 'Café' : 'Café do kit'}</span><span>${isCafe ? 'Dois cafés, dois processos' : (c.notas.join(', ').charAt(0) + c.notas.join(', ').slice(1).toLowerCase())}</span></div>
        <div class="sw">${C.cafes.map(x => sw(x, x.id === c.id)).join('')}</div></div>
      ${isCafe && p.p250 ? `
      <div class="opt"><div class="lb"><span>Tamanho</span><span>Moído para coado</span></div>
        <div class="sw">
          <button type="button" data-tam="250" aria-pressed="${st.t === '250'}"><span><b>250 g · ${brl(p.p250)}</b><small>Embalagem kraft, para conhecer</small></span></button>
          <button type="button" data-tam="500" aria-pressed="${st.t === '500'}"><span><b>500 g · ${brl(p.preco)}</b><small>O grama sai 25% mais barato</small></span></button>
        </div></div>` : ''}
      ${isCafe && !p.p250 ? `
      <div class="opt"><div class="lb"><span>Formato</span></div><div class="sw"><span class="fix"><span><b>Moído para coado · ${st.t} g</b><small>Para coador de papel ou de pano</small></span></span></div></div>
      ` : ''}
      ${isCafe ? `
      <div class="opt"><div class="lb"><span>Forma de compra</span></div>
        <div class="plans">
          <label><input type="radio" name="plan" value="0" ${st.sub ? '' : 'checked'}><span><b>Compra única</b><small>Um pacote, entregue uma vez.</small></span><span class="p num">${brl(precoBase())}</span></label>
          <label><input type="radio" name="plan" value="1" ${st.sub ? 'checked' : ''}><span><b>Assinatura mensal</b><small>Um pacote por mês, na mesma data, com 15% de desconto. Pause ou cancele quando quiser.</small></span><span class="p num">${brl(Math.round(precoBase() * .85))}<small style="display:inline;opacity:.6"> /mês</small></span></label>
        </div></div>` : ''}
      <div class="buy" data-buyrow>
        <div class="qty"><button aria-label="Diminuir" data-qd="-1">−</button><span data-qty>${st.qty}</span><button aria-label="Aumentar" data-qd="1">+</button></div>
        <button class="btn solid" data-buy><span>Adicionar</span><span class="num" data-total style="font-size:17px;letter-spacing:0">${total()}</span></button>
      </div>
      <p class="ship">${TRUCK}Enviamos para todo o Brasil. Frete pelo CEP na finalização da compra.</p>
      ${isCafe ? '' : `<details class="gmsg" open><summary>Mensagem do cartão (incluso)</summary><textarea rows="3" maxlength="140" placeholder="Escreva sua mensagem" data-msg>${(st.msg || '').replace(/</g, '&lt;')}</textarea><small data-kcnt style="display:block;text-align:right;font-size:12px;opacity:.6;margin-top:6px">${(st.msg || '').length}/140</small></details>`}
      <div class="acc">
        <details><summary>Como preparar</summary><div class="a">A receita da ORA para o coado, passo a passo, está na página dos cafés. <a href="loja.html#preparo" style="text-decoration:underline">Ver como preparar</a>.</div></details>
        <details><summary>Conservação</summary><div class="a">Depois de aberto, feche bem o pacote e guarde longe da luz e do calor. O sabor fica melhor nas primeiras semanas.</div></details>
        <details><summary>Trocas</summary><div class="a">Trocas e devoluções seguem o Código de Defesa do Consumidor; veja as condições em <a href="politicas.html#trocas" style="text-decoration:underline">Políticas</a>.</div></details>
      </div>`;

    /* abaixo da dobra */
    const other = C.cafes.find(x => x.id !== c.id), op = C.produtos.find(x => x.cafe === other.id);
    const kits = C.produtos.filter(x => x.tipoLoja === 'kit' && x.handle !== p.handle);
    const PECA = {
      'cafe-caneca': { e: 'A peça do kit', t: 'A caneca<br><em class="it">térmica ORA.</em>', p: 'Parede dupla, tampa que fecha bem e o O da ORA gravado na frente. Segura o café quente na mesa do escritório ou no caminho, do primeiro ao último gole.', m: '<img src="assets/img/kit-aberto.jpg" alt="Caneca térmica ORA dentro da caixa" loading="lazy" style="width:100%;height:100%;object-fit:cover;object-position:74% 78%">' },
      'cafe-jarra': { e: 'A peça do kit', t: 'A jarra<br><em class="it">térmica ORA.</em>', p: 'Feita para a mesa do café da manhã: coe direto nela, leve à mesa e sirva a família inteira com o café ainda quente, xícara depois de xícara.', m: '<video src="assets/video/chemex.mp4" poster="assets/video/chemex.jpg" muted loop playsinline autoplay style="width:100%;height:100%;object-fit:cover"></video>' },
      'kit-completo': { e: 'As peças do kit', t: 'Caneca e jarra,<br><em class="it">para a casa toda.</em>', p: 'A jarra para coar e servir a mesa; a caneca para levar a sua xícara aonde o dia for. Juntas, com o café ORA, são o presente para quem gosta de receber.', m: '<img src="assets/img/kit-aberto.jpg" alt="Caixa ORA aberta, com café e caneca térmica" loading="lazy" style="width:100%;height:100%;object-fit:cover;object-position:70% 70%">' }
    };
    const specRows = [['Origem', 'Fazendas de Minas Gerais'], ['Altitude', 'Acima de 1.500 m'], ['Colheita', 'Manual, de maio a setembro'], ['Secagem', c.id === 'natural' ? 'Ao sol, com a fruta inteira' : 'Ao sol, já sem a casca'],
      ...(isCafe ? [] : [['Notas', c.notas.join(', ').charAt(0) + c.notas.join(', ').slice(1).toLowerCase()]]), ...(isCafe ? [] : [['Acidez', c.acidez], ['Corpo', c.corpo], ['Final', c.final]])];
    $('[data-below]').innerHTML = `
      ${isCafe ? `<section class="cup t-espresso"><p class="eyebrow" data-fade>Na xícara</p>
        <p class="w" data-lines>${c.notas.map(n => `<span class="ln"><span>${n}</span></span>`).join('')}</p>
        <div class="row" data-fade><div><small>Acidez</small><b>${c.acidez}</b></div><div><small>Corpo</small><b>${c.corpo}</b></div><div><small>Final</small><b>${c.final}</b></div></div></section>` : ''}
      ${isCafe ? '' : `<section class="sec wrap t-espresso"><div class="inbox"><div class="r"><p class="eyebrow ln-l" data-fade>O kit</p><h2 class="display md" data-fade style="margin-top:20px">O que vem na caixa</h2><ol data-fade>${p.contem.map(x => `<li>${x}</li>`).join('')}</ol></div></div></section>`}
      ${isCafe ? `      <section class="sec wrap t-butter">
        <div class="spec">
          <div class="l"><p class="eyebrow ln-l" data-fade>${isCafe ? 'Ficha técnica' : 'Café ' + c.nome}</p><h2 class="display md" data-fade style="margin-top:20px">${isCafe ? 'Tudo sobre<br>este café' : 'O café que<br>vai no kit'}</h2>
            </div>
          <dl data-fade>${specRows.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
        </div>
      </section>
      <section class="sec wrap t-roast">
        <div class="proc">
          <div class="ph media" data-open><img src="assets/img/${c.id === 'natural' ? 'px-natural-seco' : 'px-pergaminho'}.jpg" alt="${c.id === 'natural' ? 'Cerejas de café secas, com a casca' : 'Grãos de café secando sem a casca'}" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
          <div class="tx">
            <p class="eyebrow ln-l" data-fade>${c.processo === 'Natural' ? 'Processo natural' : 'Processo cereja descascado'}</p>
            <h2 class="display md" data-fade>${c.processo === 'Natural' ? 'Seca inteiro,<br><em class="it">com a fruta.</em>' : 'Seca sem<br><em class="it">a casca.</em>'}</h2>
            <p class="lede" data-fade>${c.copo}</p>
            <a class="link" href="loja.html#c-${other.id}" data-fade>Comparar com o ${other.nome} ${ARR}</a>
          </div>
        </div>
      </section>` : `<section class="sec wrap t-butter">
        <div class="proc">
          <div class="ph media" data-open>${PECA[p.handle].m}</div>
          <div class="tx">
            <p class="eyebrow ln-l" data-fade>${PECA[p.handle].e}</p>
            <h2 class="display md" data-fade>${PECA[p.handle].t}</h2>
            <p class="lede" data-fade>${PECA[p.handle].p}</p>
            <a class="link" href="produto.html?p=cafe-${c.id}" data-fade>Ver o café ${c.nome} ${ARR}</a>
          </div>
        </div>
      </section>`}
      ${isCafe ? `<section class="sec wrap t-butter more">
        <div class="other">
          <a class="pk media pack ${other.cor === 'mocha' ? 'mocha' : ''}" href="produto.html?p=${op.handle}" data-open><img src="${other.img}" alt="Café ${other.nome}"></a>
          <div class="tx"><p class="eyebrow ln-l" data-fade>O outro café da ORA</p><h3 class="display md" data-fade>${other.nome}</h3><span class="sub" data-fade style="font-family:var(--serif);font-style:italic;font-size:20px;opacity:.7">${other.sub}</span>
            <p class="lede" data-fade>${other.frase}</p>
            <div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap" data-fade><button class="btn solid" data-quick="${op.handle}">Adicionar · ${brl(op.preco)}</button><a class="link" href="produto.html?p=${op.handle}">Conheça este café</a></div></div>
        </div>
      </section>` : ''}
      ${isCafe ? `<section class="sec wrap t-roast more"><div class="gband"><div><h2 class="display md" data-fade>Para <em class="it">presentear</em></h2><p data-fade>Café com caneca ou jarra térmica, na caixa ORA, com um cartão escrito por você. A partir de R$ 129,00.</p></div><a class="btn light" href="presentes.html" data-fade>Conheça os presentes <svg class="arr" viewBox="0 0 22 9"><path d="M0 4.5h20M16.5.8l3.8 3.7-3.8 3.7" fill="none" stroke="currentColor"/></svg></a></div></section>` : `<section class="sec wrap t-butter more">
        <div class="hd"><h2 class="display md" data-fade>Outros presentes</h2><a class="link" href="presentes.html" data-fade>Conheça nossos presentes ${ARR}</a></div>
        <div class="kgrid${kits.length === 2 ? ' k2' : ''}">${kits.map(oraKitCard).join('')}</div>
      </section>`}`;

    /* barra fixa */
    $('[data-sbar]').innerHTML = `<div class="th ${isCafe ? (c.cor === 'mocha' ? 'mocha' : '') : 'ph'}"><img src="${isCafe ? c.img : p.thumb}" alt=""></div>
      <div class="n"><b>${p.nome}${isCafe && p.p250 ? ' · ' + st.t + ' g' : ''}</b><span>${isCafe ? 'Moído para coado' + (st.sub ? ' · assinatura' : '') : 'Café ' + c.nome}</span></div>
      <span class="num" data-total>${total()}${st.sub ? '<small style="font-size:.55em;opacity:.7">/mês</small>' : ''}</span><button class="btn solid" data-buy>Adicionar</button>`;
    ORA.reveals && ORA.reveals();
    document.querySelectorAll('[data-below] video,[data-gal] video').forEach(v => { v.muted = true; v.play().catch(() => {}); });
  }

  const base = () => (st.t === '250' && p.p250) ? p.p250 : p.preco;
  const upd = () => document.querySelectorAll('[data-total]').forEach(e => e.innerHTML = brl((st.sub ? Math.round(base() * .85) : base()) * st.qty) + (st.sub && e.closest('.sbar') ? '<small style="font-size:.55em;opacity:.7">/mês</small>' : ''));
  document.addEventListener('click', e => {
    const s = e.target.closest('[data-sw]');
    if (s) {
      if (p.tipoLoja === 'cafe') { p = C.produtos.find(x => x.cafe === s.dataset.sw); if (!p.p250) st.t = '500'; history.replaceState(null, '', '?p=' + p.handle); render(); }
      else { st.v = s.dataset.sw; history.replaceState(null, '', '?p=' + p.handle + '&c=' + st.v); render(); }
      return;
    }
    const tm = e.target.closest('[data-tam]');
    if (tm) { st.t = tm.dataset.tam; render(); return; }
    const d = e.target.closest('[data-qd]');
    if (d) { st.qty = Math.max(1, Math.min(20, st.qty + +d.dataset.qd)); document.querySelector('[data-qty]').textContent = st.qty; upd(); }
    if (e.target.closest('[data-buy]')) { const m = document.querySelector('[data-msg]'); ORA.add(p.handle, { v: st.v, qty: st.qty, sub: st.sub, t: st.t, msg: m ? m.value.trim() : '' }); }
  });
  document.addEventListener('input', e => { if (e.target.matches('[data-msg]')) { st.msg = e.target.value; const k = document.querySelector('[data-kcnt]'); if (k) k.textContent = st.msg.length + '/140'; } });
  document.addEventListener('change', e => { if (e.target.name === 'plan') { st.sub = e.target.value === '1'; render(); } });

  render();
  const bar = document.querySelector('[data-sbar]');
  const io = new IntersectionObserver(([en]) => { const on = !en.isIntersecting && en.boundingClientRect.top < 0; bar.classList.toggle('on', on); bar.setAttribute('aria-hidden', !on); });
  const watch = () => { io.disconnect(); io.observe(document.querySelector('[data-buyrow]')); };
  watch(); new MutationObserver(watch).observe(document.querySelector('[data-info]'), { childList: true });
};
</script>
<script src="js/site.js?v=38"></script>
</body>
</html>
